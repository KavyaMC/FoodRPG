<!DOCTYPE html>
<html lang="en">

	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>FOOD RPG - create an account</title>
	</head>

	<body>
		<header>
			<H1>REGISTER</H1>
			<p><strong>Register to know more about this delightful world!</strong></p>
			<a href="index.html">back</a>
		</header>
		<form action="/register" method="post">
			<label for="UserName">User Name</label>
			<input type="text" name="username" id="UserName" required />
			<br />
			<label for="Email">Email ID</label>
			<input type="email" name="email" id="Email" required />
			<br />
			<label for="password">password</label>
			<input type="password" name="password" id="password" required />
			<br />
			<button type="submit">submit</button>
			<button type="reset">clear</button>
		</form>
		<p>Already have an account? <a href="login.html">login</a> instead.</p>
		<footer>
			<p>&copy: 2026 Food RPG. All rights reserved.</p>
		</footer>
	</body>

</html>
